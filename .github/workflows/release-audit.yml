name: Release integrity audit

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Verify all published assets and tags
        run: npm run check:metadata:deep
