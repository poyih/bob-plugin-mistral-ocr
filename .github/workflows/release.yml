name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z); created on the selected ref if it does not exist yet"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Resolve an existing tag for a safe retry
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          git fetch --tags origin
          existing=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)
          if [ -n "$existing" ]; then
            git checkout --detach "$existing"
          fi

      - name: Run repository checks
        run: npm run ci

      - name: Verify the archive against pending metadata and write release notes
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Ensure the tag is new or already at this commit, and the commit is on main
        run: |
          git fetch origin main
          existing=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)
          commit=$(git rev-parse HEAD)
          if [ -n "$existing" ] && [ "$existing" != "$commit" ]; then
            echo "Tag $RELEASE_TAG points at a different commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release commit is not on main" >&2
            exit 1
          fi

      - name: Verify draft asset, publish release, and update the live appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Verify the published asset, archive scope, and tags
        run: |
          git fetch origin main --tags
          git checkout --detach origin/main
          npm run check:metadata:deep
