name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z); created on the selected ref if it does not exist yet"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository checks
        run: npm run check:syntax && npm run check:secrets && npm run check:metadata && npm test

      - name: Build deterministic plugin archive
        run: npm run build && npm run check:archive

      - name: Verify the archive against appcast.json and write release notes
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Ensure the tag is new or already at this commit, and the commit is on main
        run: |
          git fetch --force --tags origin
          existing=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "Tag $RELEASE_TAG already points at $existing, not at $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

      - name: Create the GitHub release with the plugin asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/Mistral-OCR.bobplugin \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mistral OCR $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify the published asset, archive scope, and tags
        run: git fetch --tags origin && npm run check:metadata:deep
